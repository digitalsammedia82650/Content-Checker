<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate SEO + Grammar Pro Tool (Multi-Keyword)</title>

<style>
/* --- YOUR ORIGINAL CSS KEPT UNCHANGED --- */
#seoScopeTool {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f4f6f9;
  padding: 20px;
}
#seoScopeTool .container {
  max-width: 1100px;
  margin: auto;
  background: #fff;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}
#seoScopeTool textarea {
  width: 100%;
  height: 220px;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  resize: vertical;
  box-sizing: border-box;
}
#seoScopeTool .input-group {
  display: flex;
  gap: 15px;
  margin-top: 15px;
}
#seoScopeTool .input-field { flex: 1; }
#seoScopeTool label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 5px;
  color: #333;
}
#seoScopeTool input {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}
#seoScopeTool button {
  margin-top: 20px;
  padding: 12px 30px;
  border: none;
  background: #007bff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.3s;
}
#seoScopeTool button:hover { background: #0056b3; }
#seoScopeTool .results {
  margin-top: 25px;
  background: #f9f9f9;
  padding: 20px;
  border-radius: 8px;
  border-left: 5px solid #007bff;
}
#seoScopeTool .highlight {
  background: #fff3cd;
  border-bottom: 2px solid #ffc107;
  font-weight: bold;
}
#seoScopeTool .grammar-issue {
  text-decoration: underline red 2px;
}
#seoScopeTool .style-warning {
  text-decoration: underline orange 2px;
}
#seoScopeTool .score-bar {
  width: 100%;
  height: 24px;
  background: #ddd;
  border-radius: 12px;
  overflow: hidden;
  margin-top: 10px;
}
#seoScopeTool .score-fill {
  height: 100%;
  text-align: center;
  color: #fff;
  line-height: 24px;
  font-size: 14px;
  font-weight: bold;
  transition: width 0.5s ease-in-out;
}
#seoScopeTool #highlighted {
  white-space: pre-wrap;
  line-height: 1.6;
  background: #fff;
  padding: 15px;
  border: 1px solid #eee;
  border-radius: 5px;
  margin-top: 10px;
}
</style>
</head>

<body>
<div id="seoScopeTool">
<div class="container">

<h2>Ultimate SEO + Grammar Pro Tool</h2>

<textarea id="content" placeholder="Paste your content here..."></textarea>

<div class="input-group">
  <div class="input-field">
    <label for="keyword">Focus Keywords (comma separated)</label>
    <input type="text" id="keyword">
  </div>
  <div class="input-field">
    <label for="exclude">Words to Exclude (comma separated)</label>
    <input type="text" id="exclude">
  </div>
</div>

<button onclick="analyze()">Analyze Content</button>

<div class="results" id="results" style="display:none;">
  <div id="seoStats"></div>
  <hr>
  <h4>Writing Analysis</h4>
  <div id="writingStats"></div>
  <hr>
  <h4>Keyword Breakdown</h4>
  <div id="keywordBreakdown"></div>
  <hr>
  <h4>Highlighted Content</h4>
  <div id="highlighted"></div>
</div>

</div>
</div>

<script>
/* ---------- EXTENDED STOP WORDS ---------- */
const DEFAULT_STOP_WORDS = [
"i","you","he","she","it","we","they","me","him","her","us","them",
"this","that","these","those","the","a","an","and","but","or","so",
"for","yet","nor","am","is","are","was","were","be","being","been",
"have","has","had","do","does","did","will","would","shall","should",
"can","could","may","might","must","in","on","at","by","with","about",
"against","between","into","through","during","before","after","above",
"below","to","from","up","down","off","over","under","as","of",
"who","which","what","whom","whose","where","when","why"
];

function analyze(){

let text=document.getElementById("content").value;
if(!text.trim()){ alert("Please enter content."); return; }

let keywords=document.getElementById("keyword").value
.split(',').map(k=>k.trim().toLowerCase()).filter(Boolean);

let customExcludes=document.getElementById("exclude").value
.split(',').map(e=>e.trim().toLowerCase()).filter(Boolean);

let activeStop=[...DEFAULT_STOP_WORDS,...customExcludes];

let charWithSpace=text.length;
let lines=text.split(/\n/).filter(l=>l.trim()).length;

let cleanWords=text.toLowerCase().replace(/[^\w\s]/g,"").split(/\s+/);
let words=cleanWords.filter(w=>!activeStop.includes(w)&&w.length>2);
let wordCount=words.length;
let uniqueWords=new Set(words).size;
let lexicalDiversity=((uniqueWords/wordCount)*100||0).toFixed(1);
let readingTime=Math.ceil(wordCount/200);

/* KEYWORD TRACE */
let totalMatches=0;
let keywordBreakdown="";
let highlighted=text;

keywords.forEach(kw=>{
let regex=new RegExp(`\\b${kw}(s|es|ing|ed)?\\b`,"gi");
let matches=text.match(regex)||[];
totalMatches+=matches.length;
keywordBreakdown+=`<strong>${kw}</strong> → ${matches.length} matches<br>`;
highlighted=highlighted.replace(regex,`<span class="highlight">$&</span>`);
});

let keywordDensity=((totalMatches/wordCount)*100||0).toFixed(2);

/* SENTENCE ANALYSIS */
let sentences=text.match(/[^.!?]+[.!?]+/g)||[];
let short=0,medium=0,long=0;
sentences.forEach(s=>{
let len=s.trim().split(/\s+/).length;
if(len<10) short++;
else if(len<=20) medium++;
else long++;
});

/* PARAGRAPH ANALYSIS */
let paragraphs=text.split(/\n\s*\n/);
let goodParagraphs=0;
paragraphs.forEach(p=>{
let count=p.trim().split(/\s+/).length;
if(count>=40 && count<=150) goodParagraphs++;
});

/* STYLE WARNINGS */
sentences.forEach(s=>{
if(s.trim().split(/\s+/).length>25){
highlighted=highlighted.replace(s,`<span class="style-warning">${s}</span>`);
}
});
highlighted=highlighted.replace(/\b\w+ly\b/gi,
`<span class="style-warning">$&</span>`);

/* GRAMMAR IMPROVEMENTS */
highlighted=highlighted.replace(/\b(\w+)\s+\1\b/gi,
`<span class="grammar-issue">$&</span>`);

highlighted=highlighted.replace(/ {2,}/g,
`<span class="grammar-issue">$&</span>`);

highlighted=highlighted.replace(/,[ ]+[a-z]/g,
`<span class="grammar-issue">$&</span>`);

highlighted=highlighted.replace(/\b(was|were|is|are|been|being)\s+\w+ed\b/gi,
`<span class="grammar-issue">$&</span>`);

/* READABILITY */
let syllables=countSyllables(text);
let flesch=(206.835 - 1.015*(wordCount/(sentences.length||1)) - 84.6*(syllables/(wordCount||1))).toFixed(1);

/* SEO SCORE */
let score=0;
if(wordCount>=300) score+=25;
if(keywordDensity>=1 && keywordDensity<=3) score+=25;
if(lines>=5) score+=20;
if(lexicalDiversity>50) score+=15;
if(long<3) score+=15;

let color=score<40?"#e74c3c":score<70?"#f39c12":"#27ae60";

/* OUTPUT */
document.getElementById("seoStats").innerHTML=`
<strong>Characters:</strong> ${charWithSpace} |
<strong>Words:</strong> ${wordCount} |
<strong>Reading Time:</strong> ${readingTime} min<br>
<strong>Total Keyword Matches:</strong> ${totalMatches} |
<strong>Density:</strong> ${keywordDensity}%<br>
<div class="score-bar">
<div class="score-fill" style="width:${score}%;background:${color}">${score}% SEO Score</div>
</div>
`;

document.getElementById("writingStats").innerHTML=`
<strong>Flesch Reading Ease:</strong> ${flesch}<br>
<strong>Lexical Diversity:</strong> ${lexicalDiversity}%<br>
<strong>Sentence Distribution:</strong> Short ${short}, Medium ${medium}, Long ${long}<br>
<strong>Paragraph Quality:</strong> ${goodParagraphs}/${paragraphs.length}
`;

document.getElementById("keywordBreakdown").innerHTML=keywordBreakdown;
document.getElementById("highlighted").innerHTML=highlighted;
document.getElementById("results").style.display="block";
}

function countSyllables(text){
let words=text.match(/\b\w+\b/g)||[];
let count=0;
words.forEach(word=>{
let syll=word.toLowerCase()
.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'')
.replace(/^y/,'')
.match(/[aeiouy]{1,2}/g);
count+=syll?syll.length:1;
});
return count;
}
</script>
</body>
</html>
