<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate SEO + Writing Intelligence Pro Tool</title>

<style>
body{
  font-family: 'Segoe UI', sans-serif;
  background:#f4f6f9;
  padding:20px;
}

.container{
  max-width:1200px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

textarea{
  width:100%;
  height:220px;
  padding:12px;
  border-radius:6px;
  border:1px solid #ccc;
  resize:vertical;
}

.input-group{
  display:flex;
  gap:15px;
  margin-top:15px;
}

.input-field{flex:1;}

label{
  font-size:14px;
  font-weight:bold;
}

input{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  margin-top:20px;
  padding:12px 30px;
  border:none;
  background:#007bff;
  color:white;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
}

button:hover{background:#0056b3;}

.results{
  margin-top:25px;
  background:#f9f9f9;
  padding:20px;
  border-radius:8px;
}

.highlight{
  background:#fff3cd;
  border-bottom:2px solid #ffc107;
}

.grammar{
  text-decoration:underline red 2px;
}

.style{
  text-decoration:underline orange 2px;
}

.score-bar{
  height:22px;
  background:#ddd;
  border-radius:11px;
  overflow:hidden;
  margin-top:8px;
}

.score-fill{
  height:100%;
  text-align:center;
  color:#fff;
  font-weight:bold;
  line-height:22px;
}

#preview{
  white-space:pre-wrap;
  background:#fff;
  padding:15px;
  border-radius:6px;
  border:1px solid #eee;
  margin-top:10px;
  line-height:1.6;
}

.toggle-box{
  margin-top:10px;
}
</style>
</head>

<body>
<div class="container">

<h2>Ultimate SEO + Writing Intelligence Pro Tool</h2>

<textarea id="content" placeholder="Paste content here..."></textarea>

<div class="input-group">
  <div class="input-field">
    <label>Focus Keywords (comma separated)</label>
    <input type="text" id="keywords">
  </div>
  <div class="input-field">
    <label>Avoid Highlight Words</label>
    <input type="text" id="exclude">
  </div>
</div>

<div class="toggle-box">
<label><input type="checkbox" id="toggleKeyword" checked> Keyword Highlight</label>
<label><input type="checkbox" id="toggleGrammar" checked> Grammar Highlight</label>
<label><input type="checkbox" id="toggleStyle" checked> Style Highlight</label>
</div>

<button onclick="analyze()">Analyze</button>

<div class="results" id="results" style="display:none;">

<h3>SEO Stats</h3>
<div id="seoStats"></div>

<h3>Writing Analysis</h3>
<div id="writingStats"></div>

<h3>Keyword Breakdown</h3>
<div id="keywordBreakdown"></div>

<h3>Highlighted Preview</h3>
<div id="preview"></div>

</div>
</div>

<script>

/* STOP WORDS */
const DEFAULT_STOP = [
"i","you","he","she","it","we","they","me","him","her","us","them",
"this","that","these","those","the","a","an","and","but","or","so",
"in","on","at","by","with","to","from","of","as","is","are","was",
"were","be","been","being","have","has","had","do","does","did",
"will","would","shall","should","can","could","may","might","must"
];

function analyze(){

let text=document.getElementById("content").value;
if(!text.trim()){alert("Enter content");return;}

let keywords=document.getElementById("keywords").value
.split(",").map(k=>k.trim().toLowerCase()).filter(Boolean);

let customExclude=document.getElementById("exclude").value
.split(",").map(e=>e.trim().toLowerCase()).filter(Boolean);

let stop=[...DEFAULT_STOP,...customExclude];

let words=text.toLowerCase().replace(/[^\w\s]/g,"").split(/\s+/);
let filtered=words.filter(w=>!stop.includes(w)&&w.length>2);

let wordCount=filtered.length;
let unique=new Set(filtered).size;
let diversity=((unique/wordCount)*100).toFixed(1);

let readingTime=Math.ceil(wordCount/200);

let sentences=text.match(/[^.!?]+[.!?]*/g)||[];
let longSentences=0;
let short=0,medium=0,long=0;

sentences.forEach(s=>{
let len=s.trim().split(/\s+/).length;
if(len<10)short++;
else if(len<=20)medium++;
else{long++; longSentences++;}
});

let paragraphs=text.split(/\n\s*\n/);
let paraScore=0;
paragraphs.forEach(p=>{
let count=p.trim().split(/\s+/).length;
if(count>=40 && count<=150)paraScore++;
});

let flesch=calculateFlesch(text).toFixed(1);

/* KEYWORD TRACE */
let totalMatches=0;
let breakdown="";
let highlighted=text;

keywords.forEach(k=>{
let regex=new RegExp(`\\b${k}(s|es|ing|ed)?\\b`,"gi");
let matches=text.match(regex)||[];
totalMatches+=matches.length;

breakdown+=`${k} → ${matches.length} matches<br>`;

if(document.getElementById("toggleKeyword").checked){
highlighted=highlighted.replace(regex,`<span class="highlight">$&</span>`);
}
});

let density=((totalMatches/wordCount)*100||0).toFixed(2);

/* STYLE */
if(document.getElementById("toggleStyle").checked){
highlighted=highlighted.replace(/\b\w+ly\b/gi,
`<span class="style">$&</span>`);

sentences.forEach(s=>{
if(s.trim().split(/\s+/).length>25){
highlighted=highlighted.replace(s,
`<span class="style">${s}</span>`);
}
});
}

/* GRAMMAR */
if(document.getElementById("toggleGrammar").checked){

highlighted=highlighted.replace(/\b(\w+)\s+\1\b/gi,
`<span class="grammar">$&</span>`);

highlighted=highlighted.replace(/\b(was|were|is|are|been|being)\s+\w+ed\b/gi,
`<span class="grammar">$&</span>`);

highlighted=highlighted.replace(/\.{2,}/g,
`<span class="grammar">$&</span>`);
}

/* OUTPUT */

document.getElementById("seoStats").innerHTML=`
Words: ${wordCount} |
Reading Time: ${readingTime} min |
Keyword Matches: ${totalMatches} |
Density: ${density}% 
<div class="score-bar">
<div class="score-fill" style="width:${density*10>100?100:density*10}%;background:#27ae60">
${density}%</div></div>
`;

document.getElementById("writingStats").innerHTML=`
Flesch Score: ${flesch}<br>
Lexical Diversity: ${diversity}%<br>
Sentence Distribution → Short:${short} Medium:${medium} Long:${long}<br>
Long Sentences: ${longSentences}<br>
Paragraph Quality Score: ${paraScore}/${paragraphs.length}
`;

document.getElementById("keywordBreakdown").innerHTML=breakdown;

document.getElementById("preview").innerHTML=highlighted;

document.getElementById("results").style.display="block";

}

function calculateFlesch(text){
let words=text.match(/\b\w+\b/g)||[];
let sentences=text.split(/[.!?]/).length;
let syll=0;

words.forEach(w=>{
let m=w.toLowerCase().match(/[aeiouy]{1,2}/g);
syll+=m?m.length:1;
});

return 206.835-1.015*(words.length/sentences)-84.6*(syll/words.length);
}

</script>
</body>
</html>
