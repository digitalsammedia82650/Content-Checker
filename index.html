<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate SEO + Grammar Pro Tool (Fixed Edition)</title>

    <style>
        #seoScopeTool {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            padding: 20px;
            color: #333;
        }
        #seoScopeTool .container {
            max-width: 1100px;
            margin: auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        #seoScopeTool textarea {
            width: 100%;
            height: 220px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: vertical;
            box-sizing: border-box;
            font-size: 16px;
        }
        #seoScopeTool .input-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        #seoScopeTool .input-field { flex: 1; }
        #seoScopeTool label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        #seoScopeTool input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        #seoScopeTool button {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            background: #007bff;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #seoScopeTool button:hover { background: #0056b3; }

        #seoScopeTool .results {
            margin-top: 25px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid #007bff;
            display: none;
        }

        /* Highlight Styles */
        .highlight { background: #fff3cd; border-bottom: 2px solid #ffc107; font-weight: bold; padding: 0 2px; }
        .grammar-issue { text-decoration: underline red 2px; font-weight: 500; }
        .style-warning { background-color: #ffe4e1; border-bottom: 2px solid #f08080; }
        .long-sentence { border-bottom: 2px dashed #007bff; }
        
        .score-bar { width:100%; height:22px; background:#ddd; border-radius:11px; overflow:hidden; margin-top:10px;}
        .score-fill { height:100%; text-align:center; color:#fff; line-height:22px; font-size:12px; font-weight:bold; transition: width 0.5s; }
        
        #highlighted { 
            white-space: pre-wrap; 
            line-height: 1.8; 
            background: #fff; 
            padding: 20px; 
            border: 1px solid #eee; 
            border-radius: 5px; 
            margin-top: 15px;
            font-size: 16px;
        }
        
        .toggle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 15px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 8px;
        }
        .toggle-grid label { cursor: pointer; font-weight: normal; }
        hr { border: 0; border-top: 1px solid #ddd; margin: 20px 0; }
    </style>
</head>

<body>

<div id="seoScopeTool">
    <div class="container">
        <h2>Ultimate SEO + Grammar Pro Tool</h2>

        <textarea id="content" placeholder="Paste your content here..."></textarea>

        <div class="input-group">
            <div class="input-field">
                <label>Focus Keywords (comma separated)</label>
                <input type="text" id="keyword" placeholder="e.g. strategy, marketing, growth">
            </div>
            <div class="input-field">
                <label>Words to Exclude (comma separated)</label>
                <input type="text" id="exclude" placeholder="e.g. professional, results">
            </div>
        </div>

        <div class="toggle-grid">
            <label><input type="checkbox" id="toggleKeyword" checked> Highlight Keywords</label>
            <label><input type="checkbox" id="toggleRepeat" checked> Repeated Words</label>
            <label><input type="checkbox" id="toggleLong" checked> Long Sentences</label>
            <label><input type="checkbox" id="toggleAdverb"> Adverbs (-ly)</label>
            <label><input type="checkbox" id="togglePassive" checked> Passive Voice</label>
            <label><input type="checkbox" id="toggleDoubleWord" checked> Double Words</label>
            <label><input type="checkbox" id="toggleDoubleSpace" checked> Double Spaces</label>
            <label><input type="checkbox" id="toggleLowercase" checked> Lowercase Sentence Start</label>
        </div>

        <button onclick="analyze()">Analyze Content</button>

        <div class="results" id="results">
            <div id="seoStats"></div>
            <hr>
            <h4>Writing Analysis</h4>
            <div id="writingStats"></div>
            <hr>
            <h4>Keyword Breakdown</h4>
            <div id="keywordBreakdown"></div>
            <hr>
            <h4>Highlighted Content</h4>
            <div id="highlighted"></div>
        </div>
    </div>
</div>

<script>
const DEFAULT_STOP_WORDS = ["i","you","he","she","it","we","they","this","that","these","those","the","a","an","and","but","or","so","in","on","at","to","from","of","as","is","am","are","was","were","be","been","being"];

function analyze() {
    const text = document.getElementById("content").value;
    if (!text.trim()) { alert("Please enter some content."); return; }

    // 1. DATA PREPARATION
    const keywordsInput = document.getElementById("keyword").value.split(',').map(k => k.trim().toLowerCase()).filter(Boolean);
    const excludeInput = document.getElementById("exclude").value.split(',').map(e => e.trim().toLowerCase()).filter(Boolean);
    const stopWords = [...DEFAULT_STOP_WORDS, ...excludeInput];

    // Word counts
    const allWords = text.trim().split(/\s+/);
    const totalWordCount = allWords.length;
    
    const cleanWordsOnly = text.toLowerCase().replace(/[^\w\s]/g, "").split(/\s+/);
    const seoWords = cleanWordsOnly.filter(w => !stopWords.includes(w) && w.length > 2);
    
    // Sentence calculation
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    const sentenceCount = sentences.length;

    let short = 0, medium = 0, longCount = 0;
    sentences.forEach(s => {
        let len = s.trim().split(/\s+/).length;
        if (len < 10) short++;
        else if (len <= 25) medium++;
        else longCount++;
    });

    // Paragraphs
    const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);

    // 2. HIGHLIGHTING LOGIC
    let htmlOutput = text;
    let grammarCount = 0;
    let styleCount = 0;

    // Helper for Regex Escaping
    const esc = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    // Passive Voice Check
    if (document.getElementById("togglePassive").checked) {
        const passiveRegex = /\b(was|were|is|are|been|being)\s+([a-z]+ed|known|seen|taken|shown|written|made|given|kept)\b/gi;
        const matches = htmlOutput.match(passiveRegex) || [];
        grammarCount += matches.length;
        htmlOutput = htmlOutput.replace(passiveRegex, '<span class="grammar-issue">$&</span>');
    }

    // Adverbs (-ly)
    if (document.getElementById("toggleAdverb").checked) {
        const advRegex = /\b\w+ly\b/gi;
        const adverbs = htmlOutput.match(advRegex) || [];
        styleCount += adverbs.length;
        htmlOutput = htmlOutput.replace(advRegex, '<span class="style-warning">$&</span>');
    }

    // Double Words
    if (document.getElementById("toggleDoubleWord").checked) {
        const dblRegex = /\b(\w+)\s+\1\b/gi;
        const dblMatches = htmlOutput.match(dblRegex) || [];
        grammarCount += dblMatches.length;
        htmlOutput = htmlOutput.replace(dblRegex, '<span class="grammar-issue">$&</span>');
    }

    // Repeated High-Frequency Words (Non-keywords)
    if (document.getElementById("toggleRepeat").checked) {
        let freq = {};
        seoWords.forEach(w => { if(w.length > 4) freq[w] = (freq[w] || 0) + 1; });
        Object.entries(freq).forEach(([word, count]) => {
            if (count > 3 && !keywordsInput.includes(word)) {
                const r = new RegExp(`\\b${esc(word)}\\b`, "gi");
                htmlOutput = htmlOutput.replace(r, '<span class="highlight">$&</span>');
            }
        });
    }

    // Long Sentences
    if (document.getElementById("toggleLong").checked) {
        sentences.forEach(s => {
            if (s.trim().split(/\s+/).length > 25) {
                // We use replace with string to avoid breaking existing spans
                htmlOutput = htmlOutput.replace(s.trim(), `<span class="long-sentence">${s.trim()}</span>`);
            }
        });
    }

    // SEO Keywords
    let totalKeywordMatches = 0;
    let breakdownHTML = "";
    keywordsInput.forEach(k => {
        const kRegex = new RegExp(`\\b${esc(k)}(s|es|ing|ed)?\\b`, "gi");
        const matches = text.match(kRegex) || [];
        totalKeywordMatches += matches.length;
        breakdownHTML += `<strong>${k}</strong>: ${matches.length} matches<br>`;
        if (document.getElementById("toggleKeyword").checked) {
            htmlOutput = htmlOutput.replace(kRegex, '<span class="highlight">$&</span>');
        }
    });

    // 3. SCORING (Flesch Reading Ease)
    const totalSyllables = countSyllables(text);
    // Formula: 206.835 - 1.015 * (total words / total sentences) - 84.6 * (total syllables / total words)
    let flesch = (206.835 - (1.015 * (totalWordCount / sentenceCount)) - (84.6 * (totalSyllables / totalWordCount))).toFixed(1);
    if (flesch > 100) flesch = 100;

    const density = ((totalKeywordMatches / totalWordCount) * 100 || 0).toFixed(2);
    const diversity = ((new Set(seoWords).size / seoWords.length) * 100 || 0).toFixed(1);

    // 4. OUTPUT TO UI
    document.getElementById("seoStats").innerHTML = `
        <strong>Words:</strong> ${totalWordCount} | 
        <strong>Reading Time:</strong> ~${Math.ceil(totalWordCount/200)} min | 
        <strong>Keyword Density:</strong> ${density}%
        <div class="score-bar">
            <div class="score-fill" style="width:${Math.min(density*20, 100)}%; background:${density > 0.5 && density < 3 ? '#27ae60' : '#e67e22'}">${density}%</div>
        </div>`;

    document.getElementById("writingStats").innerHTML = `
        <strong>Flesch Reading Ease:</strong> ${flesch} / 100 <br>
        <strong>Vocabulary Diversity:</strong> ${diversity}% <br>
        <strong>Sentence Distribution:</strong> Short: ${short}, Med: ${medium}, Long: ${longCount} <br>
        <strong>Paragraphs:</strong> ${paragraphs.length} <br>
        <strong>Grammar/Style Issues:</strong> ${grammarCount + styleCount}
    `;

    document.getElementById("keywordBreakdown").innerHTML = breakdownHTML || "No keywords entered.";
    document.getElementById("highlighted").innerHTML = htmlOutput;
    document.getElementById("results").style.display = "block";
}

// Improved Syllable Counter
function countSyllables(text) {
    let words = text.toLowerCase().match(/\b\w+\b/g) || [];
    let count = 0;
    words.forEach(w => {
        if (w.length <= 3) { count++; return; }
        w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$ normality/, '');
        w = w.replace(/^y/, '');
        const syllables = w.match(/[aeiouy]{1,2}/g);
        count += syllables ? syllables.length : 1;
    });
    return count;
}
</script>

</body>
</html>
