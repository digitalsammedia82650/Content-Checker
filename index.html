<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate SEO + Language Audit Tool</title>
<meta name="description" content="Complete SEO Audit Tool with similarity check, keyword tracing, grammar rules, phonetics, URL and number variation detection.">

<style>
#ultimateAuditTool {
  font-family: system-ui, Arial, sans-serif;
  max-width: 1100px;
  margin: 20px auto;
  padding: 20px;
  border-radius: 10px;
  background: #f4f6f9;
  border: 1px solid #ddd;
}

#ultimateAuditTool h2 {
  text-align: center;
  margin-bottom: 20px;
}

#ultimateAuditTool textarea,
#ultimateAuditTool input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

#ultimateAuditTool button {
  padding: 10px 15px;
  border: none;
  background: #1e73be;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 10px;
}

#ultimateAuditTool button:hover {
  background: #155d94;
}

#ultimateAuditTool .resultBox {
  background: #ffffff;
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
  border: 1px solid #ccc;
}

#ultimateAuditTool .highlight {
  background: yellow;
  font-weight: bold;
}

#ultimateAuditTool .topStats {
  background: #e8f1ff;
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 15px;
  font-size: 14px;
}
</style>
</head>

<body>

<div id="ultimateAuditTool">
<h2>Ultimate SEO + Language Audit Tool</h2>

<div class="topStats">
Intent Speed: <span id="intentSpeed">0</span> ms |
Manual Approval: 
<select id="manualApproval">
<option value="Pending">Pending</option>
<option value="Approved">Approved</option>
<option value="Rejected">Rejected</option>
</select>
</div>

<label>Main Text Input</label>
<textarea id="mainText" rows="6" placeholder="Paste main content here..."></textarea>

<label>Compare Text (Similarity Check)</label>
<textarea id="compareText" rows="4" placeholder="Paste second content for similarity..."></textarea>

<label>Keyword to Trace</label>
<input type="text" id="keywordInput" placeholder="Enter keyword to trace">

<label>Avoid Highlight Words (comma separated)</label>
<input type="text" id="avoidWords" placeholder="Example: the,and,with,for">

<label>URL List (comma separated)</label>
<input type="text" id="urlInput" placeholder="https://example.com/page1, https://example.com/page2">

<label>Numbers for Variation Check (comma separated)</label>
<input type="text" id="numberInput" placeholder="10, 20, 30">

<label>Page Speed (Manual Entry ms)</label>
<input type="number" id="pageSpeed" placeholder="Enter page speed in ms">

<button onclick="runAudit()">Run Full Audit</button>

<div class="resultBox" id="results"></div>
</div>

<script>
function runAudit() {
  const startTime = performance.now();

  const text = document.getElementById("mainText").value.toLowerCase();
  const compare = document.getElementById("compareText").value.toLowerCase();
  const keyword = document.getElementById("keywordInput").value.toLowerCase();
  const avoid = document.getElementById("avoidWords").value.toLowerCase().split(",");
  const urls = document.getElementById("urlInput").value.split(",");
  const numbers = document.getElementById("numberInput").value.split(",");
  const pageSpeed = document.getElementById("pageSpeed").value;

  let resultHTML = "";

  /* 1. TEXT SIMILARITY CHECK */
  let similarity = 0;
  if (text && compare) {
    const words1 = text.split(/\s+/);
    const words2 = compare.split(/\s+/);
    const common = words1.filter(word => words2.includes(word));
    similarity = ((common.length / words1.length) * 100).toFixed(2);
    resultHTML += "<h3>Text Similarity</h3>" + similarity + "% similar<br>";
  }

  /* 2. URL VARIATION CHECK */
  if (urls.length > 1) {
    resultHTML += "<h3>URL Variation</h3>";
    urls.forEach(u => {
      resultHTML += u.trim() + "<br>";
    });
  }

  /* 3. NUMBER VARIATION CHECK */
  if (numbers.length > 1) {
    resultHTML += "<h3>Number Variation</h3>";
    numbers.forEach(n => {
      resultHTML += n.trim() + "<br>";
    });
  }

  /* 4. KEYWORD TRACE + VARIATIONS */
  if (keyword && !avoid.includes(keyword)) {
    const regex = new RegExp("(" + keyword + "[a-z]*)", "gi");
    const matches = text.match(regex);
    const count = matches ? matches.length : 0;

    resultHTML += "<h3>Keyword Trace</h3>";
    resultHTML += "Occurrences: " + count + "<br>";

    const highlighted = text.replace(regex, '<span class="highlight">$1</span>');
    resultHTML += "<div>" + highlighted + "</div>";
  }

  /* 5. GRAMMAR RULE ANALYSIS */
  const pronouns = ["i","you","he","she","it","we","they","me","him","her","us","them"];
  const conjunctions = ["and","but","or","so","for","yet","nor"];
  const auxVerbs = ["am","is","are","was","were","be","being","been","have","has","had","do","does","did","will","would","shall","should","can","could","may","might","must"];
  const prepositions = ["in","on","at","by","with","about","against","between","into","through","during","before","after","above","below","to","from","up","down","off","over","under"];

  resultHTML += "<h3>Grammar Analysis</h3>";
  text.replace(/[^a-z ]/g,"").split(/\s+/).forEach(word => {
    let category = "Noun/Other";
    if (auxVerbs.includes(word)) category = "Auxiliary Verb";
    else if (pronouns.includes(word)) category = "Pronoun";
    else if (conjunctions.includes(word)) category = "Conjunction";
    else if (prepositions.includes(word)) category = "Preposition";
    else if (word.endsWith("ly")) category = "Adverb";
    else if (["the","a","an"].includes(word)) category = "Article";
    resultHTML += word + " → " + category + "<br>";
  });

  /* 6. PHONETIC ANALYSIS */
  const firstWord = text.split(/\s+/)[0] || "";
  resultHTML += "<h3>Phonetic Analysis (First Word)</h3>";
  for (let char of firstWord) {
    if ("aeiou".includes(char)) resultHTML += char + " [Vowel]<br>";
    else if (/[a-z]/.test(char)) resultHTML += char + " [Consonant]<br>";
  }

  /* 7. PAGE SPEED */
  if (pageSpeed) {
    resultHTML += "<h3>Page Speed</h3>" + pageSpeed + " ms<br>";
  }

  const endTime = performance.now();
  document.getElementById("intentSpeed").innerText = (endTime - startTime).toFixed(2);

  document.getElementById("results").innerHTML = resultHTML;
}
</script>

</body>
</html>
