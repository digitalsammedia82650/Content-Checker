<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate SEO + Writing Intelligence Tool</title>

<style>
body{font-family:Arial;background:#f4f6f9;padding:20px;}
h1{text-align:center;}
textarea,input{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #ccc;}
button{padding:10px 15px;background:#0073e6;color:#fff;border:none;border-radius:5px;cursor:pointer;}
#output{background:#fff;padding:15px;border-radius:6px;line-height:1.8;margin-top:15px;}
.issue{background:rgba(255,0,0,0.15);border-bottom:2px solid red;cursor:pointer;position:relative;}
.issue:hover::after{
content:attr(data-tip);
position:absolute;
background:#222;color:#fff;padding:5px 8px;
font-size:12px;border-radius:4px;top:-30px;left:0;
white-space:nowrap;
}
.panel,.summary{background:#fff;padding:15px;margin-top:15px;border-radius:6px;}
.toggle-group{margin-top:10px;}
.toggle-group label{margin-right:15px;}
</style>
</head>
<body>

<h1>Ultimate SEO + Writing Intelligence Tool</h1>

<label>Main Keyword</label>
<input type="text" id="keyword">

<label>Avoid Highlighting These Words (comma separated)</label>
<input type="text" id="avoidWords">

<label>Paste Content</label>
<textarea id="content" rows="10"></textarea>

<div class="toggle-group">
<label><input type="checkbox" id="toggleGrammar" checked> Grammar</label>
<label><input type="checkbox" id="togglePassive" checked> Passive Voice</label>
<label><input type="checkbox" id="toggleAdverb" checked> Adverbs</label>
<label><input type="checkbox" id="toggleRepeat" checked> Repeated Words</label>
<label><input type="checkbox" id="toggleLong" checked> Long Sentences</label>
</div>

<button onclick="analyze()">Analyze</button>

<div id="output"></div>
<div class="summary" id="summary"></div>
<div class="panel" id="analysisPanel"></div>

<script>

function analyze(){

let content=document.getElementById("content").value;
let keyword=document.getElementById("keyword").value.toLowerCase();
let avoid=document.getElementById("avoidWords").value.toLowerCase().split(",").map(x=>x.trim());

let output=content;
let issues=[];
let grammarCount=0;
let wordCount=content.trim().split(/\s+/).length;

// Sentence Split
let sentences=content.match(/[^.!?]+[.!?]+/g)||[];
let simple=0,compound=0,complex=0;

sentences.forEach(s=>{
let lower=s.toLowerCase();
if(lower.includes(" and ")||lower.includes(" but ")||lower.includes(" or ")) compound++;
else if(lower.includes(" because ")||lower.includes(" although ")||lower.includes(" which ")) complex++;
else simple++;
});

// Long Sentence Detection
if(document.getElementById("toggleLong").checked){
sentences.forEach(s=>{
if(s.split(" ").length>25){
grammarCount++;
issues.push("Long sentence detected");
output=output.replace(s,'<span class="issue" data-tip="Long sentence (25+ words). Consider splitting." onclick="scrollToIssue(this)">'+s+'</span>');
}
});
}

// Repeated Words
if(document.getElementById("toggleRepeat").checked){
output=output.replace(/\b(\w+)\s+\1\b/gi,function(match){
grammarCount++;
issues.push("Repeated word: "+match);
return '<span class="issue" data-tip="Repeated word detected." onclick="scrollToIssue(this)">'+match+'</span>';
});
}

// Passive Voice
if(document.getElementById("togglePassive").checked){
output=output.replace(/\b(is|was|were|are|been|being)\s+\w+ed\b/gi,function(match){
grammarCount++;
issues.push("Possible passive voice: "+match);
return '<span class="issue" data-tip="Possible passive voice. Consider active form." onclick="scrollToIssue(this)">'+match+'</span>';
});
}

// Adverb Detection (-ly)
if(document.getElementById("toggleAdverb").checked){
output=output.replace(/\b\w+ly\b/gi,function(match){
let clean=match.toLowerCase();
if(!avoid.includes(clean)){
grammarCount++;
issues.push("Adverb detected: "+match);
return '<span class="issue" data-tip="Adverb detected. Consider stronger verb." onclick="scrollToIssue(this)">'+match+'</span>';
}
return match;
});
}

// Keyword Detection
let keywordCount=0;
if(keyword!=""){
let reg=new RegExp("\\b"+keyword+"\\w*\\b","gi");
let matches=content.match(reg);
if(matches) keywordCount=matches.length;
}

// Keyword Density
let density=((keywordCount/wordCount)*100).toFixed(2);

// Readability Score
let syllables=content.match(/[aeiouy]{1,2}/gi);
let syllableCount=syllables?syllables.length:1;
let flesch=206.835-(1.015*(wordCount/sentences.length))-(84.6*(syllableCount/wordCount));
flesch=flesch.toFixed(2);

// Similarity / Number Check
let numbers=content.match(/\d+/g)||[];
let numberVar=numbers.length;

// Render
document.getElementById("output").innerHTML=output;

document.getElementById("summary").innerHTML=
"<b>Summary</b><br>"+
"Words: "+wordCount+"<br>"+
"Grammar Issues: "+grammarCount+"<br>"+
"Keyword Usage: "+keywordCount+"<br>"+
"Keyword Density: "+density+"%<br>"+
"Numbers Found: "+numberVar+"<br>"+
"Flesch Score: "+flesch+"<br>"+
"Simple: "+simple+" | Compound: "+compound+" | Complex: "+complex;

document.getElementById("analysisPanel").innerHTML=
"<b>Writing Analysis</b><br>"+issues.join("<br>");
}

function scrollToIssue(el){
el.scrollIntoView({behavior:"smooth",block:"center"});
}
</script>

</body>
</html>
